name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr
      - run: pip install -r requirements-dev.txt
      - name: Unit, integration and red-team tests (SQLite)
        run: python -m pytest -q
      - name: Benchmark (fails on any PII leak)
        run: python -m eval.run_eval --out eval-results.md
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval-results.md

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Full test suite against PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: [test, test-postgres]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t compliance-review:latest .
      - name: Smoke test the production image (SQLite)
        run: |
          docker run -d --name app -p 8077:8077 \
            -e SECRET_KEY="$(python3 -c 'import secrets;print(secrets.token_urlsafe(48))')" \
            -e VAULT_KEY="$(python3 -c 'import base64,os;print(base64.urlsafe_b64encode(os.urandom(32)).decode())')" \
            -e BOOTSTRAP_ADMIN_USER=ci -e BOOTSTRAP_ADMIN_PASSWORD=ci-password-123 \
            -e COOKIE_SECURE=false compliance-review:latest
          for i in $(seq 1 30); do curl -fs localhost:8077/readyz && break; sleep 2; done
          curl -fs localhost:8077/readyz
          code=$(curl -s -o /dev/null -w '%{http_code}' localhost:8077/api/documents); test "$code" = 401
          curl -fs -c jar -H 'Content-Type: application/json' -d '{"username":"ci","password":"ci-password-123"}' localhost:8077/api/auth/login
          curl -fs -b jar localhost:8077/api/documents
          curl -fs -b jar localhost:8077/api/health | grep -q '"ocr":true'
      - name: Smoke test the Postgres + worker stack
        run: |
          printf 'SECRET_KEY=%s\nVAULT_KEY=%s\nPOSTGRES_PASSWORD=ci\nBOOTSTRAP_ADMIN_USER=ci\nBOOTSTRAP_ADMIN_PASSWORD=ci-password-123\nCOOKIE_SECURE=false\n' \
            "$(python3 -c 'import secrets;print(secrets.token_urlsafe(48))')" \
            "$(python3 -c 'import base64,os;print(base64.urlsafe_b64encode(os.urandom(32)).decode())')" > .env
          docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d
          for i in $(seq 1 45); do curl -fs localhost:8077/readyz | grep -q postgres && break; sleep 2; done
          curl -fs localhost:8077/readyz | grep -q '"db_dialect":"postgres"'
      - if: failure()
        run: docker logs app || true; docker compose -f docker-compose.yml -f docker-compose.postgres.yml logs || true
